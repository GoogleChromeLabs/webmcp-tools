name: npm Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "webmcp-evals/package-lock.json"

      - name: Install dependencies
        working-directory: ./webmcp-evals
        run: npm ci

      - name: Build distribution
        working-directory: ./webmcp-evals
        run: npm run build

      - name: Dry run (verify build & CLI help command)
        working-directory: ./webmcp-evals
        run: |
          node dist/bin/webmcp-evals.js --help
          npm publish --dry-run

      # Configure Node.js with Wombat registry for publishing
      - name: Setup Node.js for Wombat registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: "https://wombat-dressing-room.appspot.com/"

      - name: Publish to npm (Wombat)
        working-directory: ./webmcp-evals
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
