name: Skills Evaluation

on:
  push:
    branches: [main]
    paths:
      - 'webmcp-skills/**'
      - '.github/workflows/skills-evals.yml'
  pull_request:
    branches: [main]
    paths:
      - 'webmcp-skills/**'
      - '.github/workflows/skills-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: webmcp-skills/package-lock.json

      - name: Install dependencies
        working-directory: webmcp-skills
        run: npm ci

      - name: Run Unit Tests
        working-directory: webmcp-skills
        run: npm run test:unit

      - name: Validate Skill Frontmatter
        working-directory: webmcp-skills
        run: npm run skill:validate

      - name: Check for Gemini API key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY is not set."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request, always run fast, deterministic offline dry-run evaluation.
      # This prevents flaky PR checks and unnecessary paid API token consumption.
      - name: Run Modular Skill Evals (Dry-Run / PR Validation)
        if: github.event_name == 'pull_request' || steps.check_key.outputs.has_key != 'true'
        working-directory: webmcp-skills
        run: npm run eval:dry-run

      # Live evaluations with the Gemini API run only on manual workflow_dispatch or pushes to main.
      - name: Run Live Modular Skill Evals (Gemini API)
        if: github.event_name != 'pull_request' && steps.check_key.outputs.has_key == 'true'
        working-directory: webmcp-skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm test
