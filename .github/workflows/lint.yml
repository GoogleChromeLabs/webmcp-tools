name: Lint and Format

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Run oxlint and oxfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install dependencies (webmcp-evals)
        working-directory: ./webmcp-evals
        run: npm install

      - name: Run Lint (webmcp-evals)
        working-directory: ./webmcp-evals
        run: npm run lint

      - name: Run Format Check (webmcp-evals)
        working-directory: ./webmcp-evals
        run: npx oxfmt --check

      - name: Install dependencies (webmcp-skills)
        working-directory: ./webmcp-skills
        run: npm install

      - name: Run Lint (webmcp-skills)
        working-directory: ./webmcp-skills
        run: npm run lint

      - name: Run Format Check (webmcp-skills)
        working-directory: ./webmcp-skills
        run: npx oxfmt --check
