version: 2
updates:
  # Evaluator framework, CLI, and agent skills tooling
  - package-ecosystem: "npm"
    directories:
      - "/webmcp-evals"
      - "/webmcp-skills"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      tooling-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      tooling-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      tooling-major:
        applies-to: "version-updates"
        update-types:
          - "major"
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Demo applications
  - package-ecosystem: "npm"
    directories:
      - "/demos/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      demos-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      demos-minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      demos-major:
        applies-to: "version-updates"
        update-types:
          - "major"
        patterns:
          - "*"
    ignore:
      # Angular 22 (@angular/compiler-cli) and typescript-eslint v8 peer-depend on TypeScript <6.1
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    cooldown:
      default-days: 7
