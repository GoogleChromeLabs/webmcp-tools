<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Skills Evaluation Viewer</title>
    <style>
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --text-muted: #8b949e;
        --accent: #58a6ff;
        --pass: #2ea043;
        --fail: #f85149;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        padding: 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
      }
      .iteration-select {
        background: var(--card-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
      }
      .benchmark-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 24px;
        display: flex;
        gap: 32px;
      }
      .metric {
        display: flex;
        flex-direction: column;
      }
      .metric-label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .metric-val {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
      }
      .eval-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .eval-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid var(--border);
      }
      .eval-title {
        font-weight: 600;
        font-size: 15px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge-pass {
        background: rgba(46, 160, 67, 0.2);
        color: var(--pass);
      }
      .badge-fail {
        background: rgba(248, 81, 73, 0.2);
        color: var(--fail);
      }
      .eval-body {
        padding: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .run-pane {
        background: #090d13;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
      }
      .pane-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
      }
      .pane-output {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 280px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px;
        border-radius: 4px;
        color: #e6edf3;
        margin-bottom: 12px;
      }
      .assertions-list {
        list-style: none;
        font-size: 13px;
      }
      .assertion-item {
        padding: 6px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .assertion-status {
        font-weight: 600;
        margin-right: 6px;
      }
      .evidence {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
        padding-left: 18px;
      }
      .feedback-section {
        margin-top: 16px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      .feedback-input {
        width: 100%;
        background: #090d13;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 8px;
        font-size: 13px;
        resize: vertical;
        min-height: 48px;
      }
      .save-feedback-btn {
        margin-top: 8px;
        background: var(--accent);
        color: #0d1117;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Agent Skills Evaluation Viewer</h1>
        <p style="color: var(--text-muted); font-size: 13px">
          Review run outputs, assertion evidence, and record feedback.
        </p>
      </div>
      <div>
        <select id="iterationSelect" class="iteration-select"></select>
      </div>
    </header>

    <div id="benchmarkStats" class="benchmark-card"></div>
    <div id="evalsContainer"></div>

    <script type="module" src="./app.ts"></script>
  </body>
</html>
